<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            border: 2px solid #3b82f6;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .highlight {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hi, I'm Mohammed!</h1>
        <p>I am from the <span class="highlight">UAE</span> 🇦🇪.</p>
        <p>I really like <span class="highlight">drones</span> and <span class="highlight">electronics</span> ⚡️🛰️.</p>
    </div>

</body>
</html>
